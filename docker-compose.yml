# Kazi local development database (not a deployment definition).
# Binds to 127.0.0.1 only. Credentials are synthetic local values; override via .env.
services:
  postgres:
    image: postgres:17.12-alpine
    container_name: kazi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kazi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kazi_dev_local}
      POSTGRES_DB: ${POSTGRES_DB:-kazi_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kazi_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kazi_pgdata:
